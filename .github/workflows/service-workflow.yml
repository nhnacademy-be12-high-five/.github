name: MSA 서비스 공용 워크플로우

on:
  workflow_call:
    inputs:
      project-key:
        required: true
        type: string
        description: "SonarQube 프로젝트 키 (기본값)"
      docker-image:
        required: true
        type: string
        description: "Docker Hub 이미지 이름 (예: fbxogns123/member-server)"
      container-name:
        required: true
        type: string
        description: "docker-compose 서비스 기본 이름 (예: member-server)"
      maven-args:
        required: false
        type: string
        default: ""
        description: "Maven 빌드 추가 옵션"

      # 배포 실행 여부
      deploy-enabled:
        required: false
        type: boolean
        default: true
        description: "false일 경우 빌드와 테스트만 수행하고 배포는 건너뜁니다."

      # 다중 인스턴스 배포 여부
      is-multi-instance:
        required: false
        type: boolean
        default: false
        description: "true일 경우 서비스명 뒤에 -1, -2를 붙여서 순차 배포합니다."

    secrets:
      SONAR_TOKEN:
        required: true
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      SSH_IP:
        required: true
      SSH_ID:
        required: true
      SSH_PW:
        required: true
      SSH_PORT:
        required: true

jobs:
  build_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃 (전체 히스토리 가져오기)
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube 정확도를 위해 전체 이력 필요

      # 2. JDK 21 설정
      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Maven 빌드 및 SonarQube 분석 (분기 처리 적용)
      - name: Maven 빌드 및 SonarQube 분석
        run: |
          # -----------------------------------------------------------
          # 1. 프로젝트 이름 규칙 설정 (team5- 접두사 및 -server 접미사 보정)
          # -----------------------------------------------------------
          SERVICE_NAME="${{ inputs.container-name }}"
          
          if [[ "$SERVICE_NAME" == *"-server" ]]; then
            # 이미 -server가 포함된 경우 (예: member-server -> team5-member-server)
            BASE_NAME="team5-$SERVICE_NAME"
          else
            # -server가 없는 경우 (예: member -> team5-member-server)
            BASE_NAME="team5-$SERVICE_NAME-server"
          fi

          # -----------------------------------------------------------
          # 2. 브랜치별 분석 로직 분기
          # -----------------------------------------------------------
          CURRENT_BRANCH="${{ github.ref_name }}"
          echo "ℹ️ 현재 브랜치: $CURRENT_BRANCH"

          if [[ "$CURRENT_BRANCH" == "main" ]] || [[ "$CURRENT_BRANCH" == "dev" ]]; then
          
            echo "🚀 [SonarQube] Main/Dev 브랜치 감지됨. 정적 분석 및 커버리지 측정을 시작합니다."

            # 브랜치에 따른 키/이름 설정
            if [ "$CURRENT_BRANCH" == "main" ]; then
              DYNAMIC_PROJECT_KEY="${{ inputs.project-key }}"
              DYNAMIC_PROJECT_NAME="$BASE_NAME"
            else
              # dev 브랜치: 슬래시(/)를 하이픈(-)으로 변경
              SAFE_BRANCH_NAME=$(echo "$CURRENT_BRANCH" | sed 's/\//-/g')
              DYNAMIC_PROJECT_KEY="${{ inputs.project-key }}-$SAFE_BRANCH_NAME"
              DYNAMIC_PROJECT_NAME="$BASE_NAME [$SAFE_BRANCH_NAME]"
            fi

            echo "ℹ️ [설정] Key: $DYNAMIC_PROJECT_KEY"
            echo "ℹ️ [설정] Name: $DYNAMIC_PROJECT_NAME"

            # verify: 테스트 수행 및 JaCoCo 리포트 생성
            # sonar:sonar: 분석 결과 전송
            mvn clean verify sonar:sonar \
              -Dsonar.projectKey=$DYNAMIC_PROJECT_KEY \
              -Dsonar.projectName="$DYNAMIC_PROJECT_NAME" \
              -Dsonar.host.url=http://s4.java21.net:9000 \
              -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
              -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
              ${{ inputs.maven-args }}

          else
            # -----------------------------------------------------------
            # 3. 그 외 브랜치 (PR 등): 분석 없이 테스트만 수행
            # -----------------------------------------------------------
            echo "🚧 [Build Only] Main/Dev 브랜치가 아닙니다. SonarQube 분석 없이 빌드와 테스트만 수행합니다."
          
            # sonar:sonar 제외, verify만 실행하여 빌드/테스트 검증
            mvn clean verify ${{ inputs.maven-args }}
          fi

      # 4. Docker Hub 로그인
      - name: Docker Hub 로그인
        if: ${{ inputs.deploy-enabled }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Docker 이미지 빌드 및 푸시
      - name: Docker 이미지 빌드 및 푸시
        if: ${{ inputs.deploy-enabled }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ inputs.docker-image }}:latest

      # 6. 서버 배포 (SSH)
      - name: 서버 배포 (SSH)
        if: ${{ inputs.deploy-enabled }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PW }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "🚀 ${{ inputs.container-name }} 서비스 배포 시작..."
            cd ~/www/nhnbook
              
            SERVICE_BASE="${{ inputs.container-name }}"
            IS_MULTI="${{ inputs.is-multi-instance }}"
              
            # 함수: 서비스 인스턴스 하나를 우아하게 종료하고 재배포
            deploy_instance() {
              local SERVICE_NAME=$1
              echo "----------------------------------------------------"
              echo "🔄 [$SERVICE_NAME] 배포 프로세스 시작"
              
              # 1. Eureka에서 제외 (OUT_OF_SERVICE 설정)
              # 주의: 컨테이너 내부 포트(8080)로 Actuator 호출
              echo "🛑 [$SERVICE_NAME] Eureka에서 제외 요청 (OUT_OF_SERVICE)..."
              docker exec $SERVICE_NAME curl -s -X POST "http://localhost:8080/actuator/service-registry?status=OUT_OF_SERVICE" -H "Content-Type: application/json" || echo "⚠️ Actuator 호출 실패 (첫 배포이거나 컨테이너가 꺼져있음)"
              
              # 2. Gateway 캐시 갱신 대기 (Eureka 기본 캐시 30초 + 여유 5초)
              # 이 시간이 지나야 Gateway가 "아, 쟤는 이제 제외구나" 하고 트래픽을 안 보냄
              echo "⏳ [$SERVICE_NAME] Gateway 캐시 갱신 대기 (35초)..."
              sleep 35
              
              # 3. 도커 컨테이너 재배포 (Pull & Up)
              echo "Contents Update & Restart..."
              docker compose pull $SERVICE_NAME
              docker compose up -d $SERVICE_NAME
              
              # 4. 헬스체크 (서비스가 완전히 뜰 때까지 대기)
              echo "🏥 [$SERVICE_NAME] 헬스체크 중..."
              for retry in {1..20}; do
                # 컨테이너 내부에서 본인의 헬스 상태 확인
                STATUS=$(docker exec $SERVICE_NAME curl -s http://localhost:8080/actuator/health | grep '"status":"UP"')
                if [ -n "$STATUS" ]; then
                  echo "✅ [$SERVICE_NAME] 구동 완료 (UP)!"
                  return 0
                fi
                echo "Wait... ($retry/20)"
                sleep 5
              done
              
              echo "❌ [$SERVICE_NAME] 헬스체크 실패! 배포 중단."
              exit 1
            }
              
            # --- 배포 로직 실행 ---
            if [ "$IS_MULTI" == "true" ]; then
              echo "ℹ️ 다중 인스턴스(-1, -2) 무중단 배포 모드입니다."
              
              # 1번 인스턴스 배포
              deploy_instance "${SERVICE_BASE}-1"
              
              # 2번 인스턴스 배포
              deploy_instance "${SERVICE_BASE}-2"
              
            else
              echo "ℹ️ 단일 인스턴스 배포 모드입니다. (다운타임 발생 가능)"
              docker compose pull $SERVICE_BASE
              docker compose up -d $SERVICE_BASE
            fi
              
            # (선택 사항) 사용하지 않는 이미지 정리
            docker image prune -f
            echo "✅ 전체 배포 완료!"