name: MSA 서비스 공용 워크플로우

on:
  workflow_call:
    inputs:
      project-key:
        required: true
        type: string
        description: "SonarQube 프로젝트 키"
      docker-image:
        required: true
        type: string
        description: "Docker Hub 이미지 이름 (예: fbxogns123/member-server)"
      container-name:
        required: true
        type: string
        description: "docker-compose 서비스 기본 이름 (예: member-server)"
      maven-args:
        required: false
        type: string
        default: ""
        description: "Maven 빌드 옵션"

      # [기존] 배포 실행 여부
      deploy-enabled:
        required: false
        type: boolean
        default: true
        description: "false일 경우 빌드와 분석만 수행하고 배포는 건너뜁니다."

      # [추가됨] 다중 인스턴스 배포 여부 (기본값: false)
      is-multi-instance:
        required: false
        type: boolean
        default: false
        description: "true일 경우 서비스명 뒤에 -1, -2를 붙여서 순차 배포합니다."

    secrets:
      SONAR_TOKEN:
        required: true
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      SSH_IP:
        required: true
      SSH_ID:
        required: true
      SSH_PW:
        required: true
      SSH_PORT:
        required: true

jobs:
  build_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. JDK 설정
      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Maven 빌드 + SonarQube 분석
      - name: Maven 빌드 및 SonarQube 분석
        run: |
          # 1. 입력받은 서비스 이름 가져오기
          SERVICE_NAME="${{ inputs.container-name }}"
          
          # 2. 프로젝트명 조립 (team5- 접두사 붙이기)
          # 만약 SERVICE_NAME이 'member'라면 'team5-member-server'가 됩니다.
          # 만약 SERVICE_NAME이 'member-server'라면 'team5-member-server'가 됩니다.
          if [[ "$SERVICE_NAME" == *"-server" ]]; then
            # 이미 -server가 포함된 경우
            BASE_NAME="team5-$SERVICE_NAME"
          else
            # -server가 없는 경우 붙여줌
            BASE_NAME="team5-$SERVICE_NAME-server"
          fi

          # 3. 브랜치에 따른 Key/Name 분기
          SAFE_BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          
          if [ "${{ github.ref_name }}" == "main" ]; then
            DYNAMIC_PROJECT_KEY="${{ inputs.project-key }}"
            DYNAMIC_PROJECT_NAME="$BASE_NAME"
          else
            DYNAMIC_PROJECT_KEY="${{ inputs.project-key }}-$SAFE_BRANCH_NAME"
            DYNAMIC_PROJECT_NAME="$BASE_NAME [$SAFE_BRANCH_NAME]"
          fi

          echo "ℹ️ [정보] SonarQube Key: $DYNAMIC_PROJECT_KEY"
          echo "ℹ️ [정보] 생성될 프로젝트 명: $DYNAMIC_PROJECT_NAME"

          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=$DYNAMIC_PROJECT_KEY \
            -Dsonar.projectName="$DYNAMIC_PROJECT_NAME" \
            -Dsonar.host.url=http://s4.java21.net:9000 \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            ${{ inputs.maven-args }}

      # 4. Docker Hub 로그인 (deploy-enabled가 true일 때만 실행)
      - name: Docker Hub 로그인
        if: ${{ inputs.deploy-enabled }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Docker 이미지 빌드 및 푸시 (deploy-enabled가 true일 때만 실행)
      - name: Docker 이미지 빌드 및 푸시
        if: ${{ inputs.deploy-enabled }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ inputs.docker-image }}:latest

      # 6. 서버 접속 및 배포 (deploy-enabled가 true일 때만 실행)
      - name: 서버 배포 (SSH)
        if: ${{ inputs.deploy-enabled }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PW }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "🚀 ${{ inputs.container-name }} 서비스 배포 시작..."
            cd ~/www/nhnbook

            SERVICE_BASE="${{ inputs.container-name }}"
            IS_MULTI="${{ inputs.is-multi-instance }}"

            # --- 배포 로직 분기 ---
            if [ "$IS_MULTI" == "true" ]; then
              echo "ℹ️ 다중 인스턴스(-1, -2) 순차 배포 모드입니다."
            
              for i in 1 2; do
                # 주의: docker-compose 서비스 이름 규칙에 맞춰 하이픈(-) 사용
                TARGET_SERVICE="${SERVICE_BASE}-${i}"
            
                echo "🔄 $TARGET_SERVICE 업데이트 중..."
                docker compose pull $TARGET_SERVICE
                docker compose up -d $TARGET_SERVICE
            
                echo "⏳ 안정화를 위해 5초 대기..."
                sleep 5
              done
            else
              echo "ℹ️ 단일 인스턴스 배포 모드입니다."
              echo "🔄 $SERVICE_BASE 업데이트 중..."
              docker compose pull $SERVICE_BASE
              docker compose up -d $SERVICE_BASE
            fi
            # ---------------------

            # 게이트웨이 헬스체크 (서비스가 올라온 후 정상 응답하는지 확인)
            echo "🏥 전체 서비스 헬스체크 시작 (Gateway)..."
            HEALTHY=false
            for i in {1..12}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:10485/actuator/health || echo "000")
              if [ "$STATUS" == "200" ]; then
                HEALTHY=true
                echo "✅ 헬스체크 성공 (HTTP 200 OK)"
                break
              fi
              echo "⏳ [$i/12] 대기 중... (현재 상태: $STATUS)"
              sleep 5
            done

            if [ "$HEALTHY" != true ]; then
              echo "❌ 배포 실패: Gateway 헬스체크 타임아웃"
              exit 1
            fi

            docker image prune -f
            echo "✅ ${{ inputs.container-name }} 서비스 배포 완료!"